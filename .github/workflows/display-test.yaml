name: Display Quote

on:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        
      - uses: actions/setup-python@v7
        with:
            python-version: "3.13"

      - name: install dependencies
        run: pip install -r requirements.txt

      - name: run tests
        run: python -m pytest.py
        # alert